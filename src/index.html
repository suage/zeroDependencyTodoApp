<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>TODO</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b6cf6'/%3E%3Cpath d='M8 17l6 6 11-13' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1 class="app-title">TODO</h1>

    <form id="add-form" class="add-form" novalidate>
      <label class="visually-hidden" for="new-title">新しいタスク</label>
      <input id="new-title" class="add-input" type="text" placeholder="やることを入力して Enter" autocomplete="off" autofocus>
      <button type="submit" class="button button-primary">追加</button>
    </form>
    <p id="form-error" class="message message-error" role="alert" hidden></p>

    <section class="panel" aria-label="タスク一覧">
      <div id="toolbar" class="toolbar" hidden>
        <label class="toggle-all">
          <input id="toggle-all" type="checkbox">
          <span>すべて完了にする</span>
        </label>
      </div>

      <ul id="todo-list" class="todo-list"></ul>
      <p id="empty-message" class="empty" hidden></p>

      <footer id="footer" class="footer" hidden>
        <span id="remaining" class="remaining" role="status"></span>
        <nav class="filters" aria-label="表示の絞り込み">
          <a href="#/" data-filter="all">すべて</a>
          <a href="#/active" data-filter="active">未完了</a>
          <a href="#/completed" data-filter="completed">完了</a>
        </nav>
        <button id="clear-completed" type="button" class="button button-quiet">完了済みを削除</button>
      </footer>
    </section>

    <p id="storage-warning" class="message message-warning" role="status" hidden>
      ブラウザのストレージに保存できません。ページを閉じるとタスクは消えます。
    </p>

    <p class="hint">タスクをダブルクリック、または「編集」ボタンで名前を変更できます。</p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
